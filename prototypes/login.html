<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — MSITest</title>
  <style>
    /* ─── Airtable tokens ───────────────────────────────────────────── */
    :root {
      --bg:           #ffffff;
      --surface:      #ffffff;
      --fg:           #181d26;
      --fg-2:         #333333;
      --muted:        rgba(4, 14, 32, 0.69);
      --border:       #e0e2e6;
      --border-soft:  #eef0f3;
      --accent:       #1b61c9;
      --accent-on:    #ffffff;
      --accent-hover: #254fad;
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success:      #006400;
      --success-text: #006400;
      --warn:         #eab308;
      --warn-text:    #8a6500;
      --danger:       #dc2626;
      --danger-text:  #a10d3d;
      --font-display: "Haas Groot Disp", Haas, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      --font-body:    Haas, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      --font-mono:    ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
      --text-xs:   12px;
      --text-sm:   14px;
      --text-base: 16px;
      --text-lg:   20px;
      --text-xl:   24px;
      --text-2xl:  32px;
      --text-3xl:  40px;
      --text-4xl:  48px;
      --leading-body:  1.35;
      --leading-tight: 1.20;
      --tracking-display: 0;
      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-12: 48px;
      --radius-sm:   12px;
      --radius-md:   16px;
      --radius-lg:   24px;
      --radius-pill: 9999px;
      --elev-raised:
        0 0 1px rgba(0, 0, 0, 0.32),
        0 0 2px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(45, 127, 249, 0.28),
        inset 0 0 0 0.5px rgba(0, 0, 0, 0.06);
      --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    /* ─── page layout ──────────────────────────────────────────────────── */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }
    .login-card { width: 100%; max-width: 400px; }

    /* ─── brand header ───────────────────────────────────────────────── */
    .brand { text-align: center; margin-bottom: var(--space-8); }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      color: var(--fg);
      letter-spacing: -0.01em;
      margin-bottom: var(--space-3);
    }
    .brand-logo svg { flex-shrink: 0; }
    .brand-tagline {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ─── card ──────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-8);
      box-shadow: var(--elev-raised);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 400;
      color: var(--fg);
      margin: 0 0 var(--space-1);
    }
    .card-sub { font-size: var(--text-sm); color: var(--muted); margin: 0 0 var(--space-6); }

    /* ─── form ──────────────────────────────────────────────────────── */
    .field { margin-bottom: var(--space-5); }
    .field label {
      display: block;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg);
      margin-bottom: var(--space-2);
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--fg);
      background: var(--surface);
      transition: border-color var(--motion-fast) var(--ease-standard),
                  box-shadow var(--motion-fast) var(--ease-standard);
      outline: none;
      -webkit-appearance: none;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus-visible { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .field-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: var(--space-5);
    }
    .forgot-link { font-size: var(--text-sm); color: var(--accent); }
    .forgot-link:hover { color: var(--accent-hover); }

    /* ─── primary button ────────────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 13px 24px;
      background: var(--accent);
      color: var(--accent-on);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 500;
      letter-spacing: 0.08px;
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-standard);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { background: var(--accent-active); }
    .btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* ─── divider ───────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) 0;
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ─── SSO button ────────────────────────────────────────────────── */
    .btn-sso {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      padding: 13px 24px;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 500;
      letter-spacing: 0.08px;
      cursor: pointer;
      transition: border-color var(--motion-fast) var(--ease-standard),
                  background var(--motion-fast) var(--ease-standard);
    }
    .btn-sso:hover { border-color: var(--fg); background: var(--border-soft); }
    .btn-sso:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* ─── signup link ──────────────────────────────────────────────── */
    .signup-row { text-align: center; margin-top: var(--space-6); font-size: var(--text-sm); color: var(--muted); }
    .signup-row a { color: var(--accent); font-weight: 500; }
    .signup-row a:hover { color: var(--accent-hover); }

    /* ─── footer ─────────────────────────────────────────────────────── */
    .login-footer {
      text-align: center;
      margin-top: var(--space-8);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
    }
    .login-footer a { color: var(--muted); }
    .login-footer a:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="28" height="28" rx="7" fill="#1b61c9"/>
            <path d="M8 10.5L13.5 17L20 10.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 17L13.5 10.5L20 17" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          MSITest
        </div>
        <p class="brand-tagline">AI-powered E2E test intelligence</p>
      </div>

      <!-- Card -->
      <div class="card">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Sign in to your workspace</p>

        <!-- Email -->
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" type="email" placeholder="you@company.com" autocomplete="email" spellcheck="false" />
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <!-- Forgot -->
        <div class="field-row">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button class="btn-primary" type="button" onclick="this.textContent='Signing in…'">
          Sign in
        </button>

        <!-- Divider -->
        <div class="divider">or</div>

        <!-- SSO -->
        <button class="btn-sso" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M17 9C17 13.9706 13.9706 18 9 18C4.02944 18 1 13.9706 1 9C1 4.02944 4.02944 0 9 0C13.9706 0 17 4.02944 17 9Z" fill="#4285F4"/>
            <path d="M17 9L11 9M17 9L13.5 12.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Sign up -->
      <p class="signup-row">
        No account? <a href="onboarding.html">Create one</a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="login-footer">
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
    <a href="#">Security</a>
    <span>© 2025 MSITest Inc.</span>
  </footer>
</body>
</html>
